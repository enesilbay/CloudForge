services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudforge-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudforge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cloudforge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cloudforge} -d $${POSTGRES_DB:-cloudforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudforge-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudforge-backend
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://cloudforge:cloudforge_secret@postgres:5432/cloudforge_db
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudforge-worker
    restart: always
    command: celery -A tasks.worker.celery_app worker --loglevel=info
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://cloudforge:cloudforge_secret@postgres:5432/cloudforge_db
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
